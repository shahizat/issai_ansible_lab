- name: Copy compute node RPMs to /tmp
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /tmp/
    mode: '0644'
  loop:
    - slurm-24.11.4-1.el9.x86_64.rpm
    - slurm-perlapi-24.11.4-1.el9.x86_64.rpm
    - slurm-slurmd-24.11.4-1.el9.x86_64.rpm
    - slurm-libpmi-24.11.4-1.el9.x86_64.rpm

- name: Install compute node RPMs
  ansible.builtin.dnf:
    name: "/tmp/{{ item }}"
    disable_gpg_check: yes
    state: present
  loop:
    - slurm-24.11.4-1.el9.x86_64.rpm
    - slurm-perlapi-24.11.4-1.el9.x86_64.rpm
    - slurm-slurmd-24.11.4-1.el9.x86_64.rpm
    - slurm-libpmi-24.11.4-1.el9.x86_64.rpm

- name: Create /etc/slurm directory
  ansible.builtin.file:
    path: /etc/slurm
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy slurm.conf with cgroup enabled
  ansible.builtin.copy:
    src: slurm.conf
    dest: /etc/slurm/slurm.conf
    owner: slurm
    group: slurm
    mode: '0644'

- name: Copy cgroup.conf into place
  ansible.builtin.copy:
    src: cgroup.conf
    dest: /etc/slurm/cgroup.conf
    owner: root
    group: root
    mode: '0644'

- name: Ensure /var/spool/slurmd exists
  ansible.builtin.file:
    path: /var/spool/slurmd
    state: directory
    owner: slurm
    group: slurm
    mode: '0755'

- name: Ensure /var/log/slurm exists
  ansible.builtin.file:
    path: /var/log/slurm
    state: directory
    owner: slurm
    group: slurm
    mode: '0755'


- name: Start and enable munge
  ansible.builtin.service:
    name: munge
    state: started
    enabled: true

- name: Start and enable slurmd
  ansible.builtin.service:
    name: slurmd
    state: restarted
    enabled: true
